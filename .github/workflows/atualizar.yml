name: Atualizar contratos (PNCP)

on:
  schedule:
    - cron: "17 9 * * *"   # todo dia, 06:17 em Fortaleza
  workflow_dispatch: {}      # botão "Run workflow" para atualizar na hora

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Baixar contratos do PNCP
        run: python scripts/atualizar_pncp.py
      - name: Salvar se mudou
        run: |
          git config user.name "robo-upaon"
          git config user.email "robo-upaon@users.noreply.github.com"
          git add data/raposa_pncp.json
          git diff --cached --quiet || git commit -m "Atualiza contratos do PNCP ($(date +%d/%m/%Y))"
          git push
